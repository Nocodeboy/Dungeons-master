<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>Combate · Marca de Granito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+SC:wght@500;700&family=Cinzel:wght@600;700&display=swap">
<style>
  /* Banco de pruebas del combate: el escenario a pantalla completa; la interfaz la monta src/combat/hud.js. */
  :root { --tinta: #0e0a08; --laton: #c9a55c; --apagado: #b09d7f; --ascua: #e2803e; color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--tinta); color: #ecdfc4; font-family: 'Alegreya', Georgia, serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
  #escena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #carga { position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; justify-items: center; gap: 18px; padding-inline: 16px; background: radial-gradient(ellipse at 50% 60%, #2a1a10 0%, var(--tinta) 70%); transition: opacity .8s; }
  body.lista #carga { opacity: 0; pointer-events: none; }
  #carga h1 { margin: 0; font: 700 clamp(22px, 5vw, 40px)/1.1 'Cinzel', Georgia, serif; letter-spacing: 0.18em; color: var(--laton); text-align: center; }
  #carga-texto { margin: 0; font: italic 17px/1.4 'Alegreya', Georgia, serif; color: var(--apagado); text-align: center; }
  .carga-detalle { margin: 0; max-width: min(560px, 90vw); font: 14px/1.4 'Alegreya', Georgia, serif; color: rgba(236,223,196,0.6); text-align: center; overflow-wrap: anywhere; }
  #carga .pista { width: min(280px, 70vw); height: 3px; background: rgba(201,165,92,0.2); overflow: hidden; }
  #carga-barra { height: 100%; background: linear-gradient(90deg, var(--ascua), var(--laton)); transform-origin: left; transform: scaleX(0.04); transition: transform .3s; }
  .mdg-combate .hud { opacity: 0; }
  body.lista .mdg-combate .hud { opacity: 1; }
  body.lista .mdg-combate.oculto .hud { opacity: 0; }
</style>

<canvas id="escena" aria-label="El campo de batalla"></canvas>

<div id="carga">
  <h1>Marca de Granito</h1>
  <p id="carga-texto">Los perros ladran hacia el bosque…</p>
  <div class="pista"><div id="carga-barra"></div></div>
</div>

<script type="module" src="combate.js"></script>

</body></html>
