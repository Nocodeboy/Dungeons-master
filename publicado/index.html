<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Marca de Granito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+SC:wght@500;700&family=Cinzel:wght@600;700&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #0e0a08; color: #ecdfc4; overflow: hidden; color-scheme: dark; }
  #escena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  #carga { position: fixed; inset: 0; display: grid; place-items: center; background: #0e0a08; color: #c9a55c; font: 600 18px Cinzel, Georgia, serif; letter-spacing: .08em; z-index: 100; }
</style>
<canvas id="escena"></canvas>
<div id="ui"></div>
<div id="carga">Marca de Granito</div>
<script type="module" src="juego.js"></script>

</body></html>
