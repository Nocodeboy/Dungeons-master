; Marca de Granito PC · ajustes del motor
; Estética pintada con luz horneada: Lumen y la exposición automática se apagan en el proyecto
; (Lumen se podrá activar en la calidad «Épica» desde los ajustes del juego).

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/Engine.RendererSettings]
; Luz horneada (Lightmass por CPU) para la sombra suave «pintada». GPU Lightmass no sirve en el
; sobremesa de desarrollo: pide una gráfica con trazado de rayos y la RX 570 no lo tiene.
r.AllowStaticLighting=True
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.GenerateMeshDistanceFields=True
; Sin Nanite ni sombras virtuales: piden Shader Model 6.6 y la RX 570 no lo garantiza.
; Sombras clásicas (mapas de sombras) para antorchas, faroles y conjuros.
r.Nanite.ProjectEnabled=False
r.Shadow.Virtual.Enable=0
; Exposición fija: el cuadro no debe «respirar» al mover la cámara
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
; Profundidad personalizada con stencil: contornos y resaltado al pasar el ratón
r.CustomDepth=3

[/Script/Engine.Engine]
; El juego usa el núcleo de reglas cargado desde Content/Data (ver UMdgRulesSubsystem)
